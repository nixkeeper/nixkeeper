[build-system]
requires = ["setuptools>=77"]  # license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "nixkeeper"
version = "0.22.0"
description = "Health dashboard for every nixpkgs package: new releases, build and update failures, vulnerabilities and open PRs, by maintainer and team"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["brotli"]

[project.scripts]
nixkeeper = "nixkeeper.cli:main"
# The old commands, until 1.0: `nixkeeper sync` etc. with a hint.
nixkeeper-sync = "nixkeeper.cli:sync_alias"
nixkeeper-frequent-check = "nixkeeper.cli:frequent_check_alias"
nixkeeper-pr-check = "nixkeeper.cli:pr_check_alias"

[tool.setuptools.packages.find]
include = ["nixkeeper*"]

[tool.setuptools.package-data]
nixkeeper = [
  "templates/package-lists/*.nix",  # nixkeeper init's starter lists
  "page/*",  # the page, copied in from page/ when the package is built
  "community/*.nix",  # the community rules, likewise
]

[tool.mypy]
# nix flake check runs it (checks.lint). Only functions with annotations
# are checked: for now, those that build a row's verdict, with row: Row
# (shape.Row).
files = ["nixkeeper"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = "brotli"  # no type information
ignore_missing_imports = true

[tool.ruff]
line-length = 88  # Python's standard (Black / ruff default)

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, isort
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
